# Redraws the profile panels from live GitHub data.
#
# Public repo, so these minutes are free. The job only commits when a panel
# actually changed, which keeps the history readable and stops a no-op run
# from churning camo's cache.
name: telemetry

on:
  schedule:
    # 05:23 UTC daily, which is late morning IST.
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/telemetry.yml']

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Render panels
        env:
          # The default token is enough today: "include private contributions on
          # my profile" is enabled on the account, so the aggregate count is
          # public and any token sees the full number. PROFILE_TOKEN is an
          # optional user PAT, kept only so that turning that setting off later
          # degrades to public-only rather than rendering a wrong number.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: node scripts/build.mjs

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          git diff --staged --quiet && echo 'no change' && exit 0
          git commit -m 'chore: refresh telemetry panels'
          git push
